schema_version = "1.3"
source = "Adapted from the early history of swarmkit (github.com/Anvoker/swarmkit), February 2026"

# Only the agent's source directory reaches the verifier.
artifacts = ["/app/src"]

[task]
name = "anvoker/nested-search"
description = "Design and build a Rust PSO library's architecture for composable, nested, parallel and reproducible searches, given only how users call it."
authors = [{ name = "Andrei Ionescu" }]
keywords = ["rust", "api-design", "generics", "type-inference", "concurrency", "determinism", "optimization"]

[metadata]
category = "software-engineering"
difficulty_explanation = "Only the call sites are given: components written as closures that are prepared once per search with the outer particle's position, nested to any depth, run in parallel and reproducible across thread counts. The agent designs the traits, so that every hidden composition infers its types from the arguments, mismatched compositions fail to compile, and each search runs on fresh, prepared components."

[verifier]
# Each test file also has a 3-minute limit (tests/test.sh), so a solution that
# deadlocks fails cleanly instead of running into this one.
timeout_sec = 3600
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096

[agent]
timeout_sec = 1800
# While the agent works it can reach only its model API. The public swarmkit
# history contains a solution, so open network access would let it look one up.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.deepseek.com"]

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
storage_mb = 10240
# Setup (installing the agent's harness) needs the network; the agent run
# itself is restricted in [agent] above.
network_mode = "public"
